<svg width="180" height="180" viewBox="0 0 180 180" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="board" x1="90" y1="0" x2="90" y2="180" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1F2E28"/>
      <stop offset="100%" stop-color="#24352E"/>
    </linearGradient>
  </defs>

  <!-- Chalkboard -->
  <rect width="180" height="180" rx="32" fill="url(#board)"/>

  <!-- Chalk dust grain -->
  <g fill="#F2EFE4">
    <circle cx="36" cy="38" r="1.1" opacity="0.16"/>
    <circle cx="150" cy="112" r="1" opacity="0.14"/>
    <circle cx="58" cy="146" r="0.9" opacity="0.12"/>
    <circle cx="112" cy="150" r="0.8" opacity="0.12"/>
    <circle cx="28" cy="108" r="0.9" opacity="0.14"/>
    <circle cx="150" cy="150" r="0.7" opacity="0.1"/>
    <circle cx="96" cy="24" r="0.8" opacity="0.1"/>
  </g>

  <!-- Hand-chalked "Q" -->
  <circle cx="86" cy="90" r="34" stroke="#E3B431" stroke-width="16" stroke-linecap="round"/>
  <path d="M84 96 L134 140" stroke="#E3B431" stroke-width="16" stroke-linecap="round"/>

  <!-- Correct-answer badge, the app's own marker language -->
  <circle cx="138" cy="44" r="24" fill="#5C9E79"/>
  <path d="M126 44 L134 52 L152 30" stroke="#F2EFE4" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
</svg>
